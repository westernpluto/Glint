name: Build iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Glint (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          # Newest installed Xcode 27.x (the iPhone Duo APIs need the 27.1+ SDK).
          XC=""; BEST=""
          for c in /Applications/Xcode*.app; do
            [ -f "$c/Contents/Info.plist" ] || continue
            V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$c/Contents/Info.plist" 2>/dev/null || true)
            case "$V" in 27*) ;; *) continue ;; esac
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST" "$V" | sort -V | tail -n1)" = "$V" ]; then BEST="$V"; XC="$c"; fi
          done
          if [ -z "$XC" ]; then
            echo "::warning::No Xcode 27 found in /Applications, using the runner default"
            XC="$(dirname "$(dirname "$(xcode-select -p)")")"
          fi
          echo "Using $XC ($BEST)"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version; exit 0
          fi
          if command -v brew >/dev/null 2>&1 && brew install xcodegen; then
            xcodegen --version; exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          BIN="$(dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -n1)")"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned, device)
        run: |
          set +e
          xcodebuild \
            -project Glint.xcodeproj \
            -scheme Glint \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|\*\* BUILD" build.log || true
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::Last 200 lines of build log"; tail -n 200 build.log; echo "::endgroup::"
            exit "$STATUS"
          fi

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Glint.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Glint.ipa Payload
          ls -lh Glint.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Built $BUNDLE version $VERSION ($BUILD)"
          echo "GLINT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GLINT_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Glint-${{ env.GLINT_VERSION }}-build${{ env.GLINT_BUILD }}-ipa
          path: Glint.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  screenshots:
    name: Simulator screenshots (design review)
    runs-on: xcode-27
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          # Newest installed Xcode 27.x (the iPhone Duo APIs need the 27.1+ SDK).
          XC=""; BEST=""
          for c in /Applications/Xcode*.app; do
            [ -f "$c/Contents/Info.plist" ] || continue
            V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$c/Contents/Info.plist" 2>/dev/null || true)
            case "$V" in 27*) ;; *) continue ;; esac
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST" "$V" | sort -V | tail -n1)" = "$V" ]; then BEST="$V"; XC="$c"; fi
          done
          if [ -z "$XC" ]; then
            echo "::warning::No Xcode 27 found in /Applications, using the runner default"
            XC="$(dirname "$(dirname "$(xcode-select -p)")")"
          fi
          echo "Using $XC ($BEST)"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then exit 0; fi
          if command -v brew >/dev/null 2>&1 && brew install xcodegen; then exit 0; fi
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -n1)" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for simulator (Debug)
        run: |
          set +e
          xcodebuild -project Glint.xcodeproj -scheme Glint -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > sim-build.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|\*\* BUILD" sim-build.log || true
          if [ "$STATUS" -ne 0 ]; then tail -n 150 sim-build.log; exit "$STATUS"; fi

      - name: Capture screenshots
        run: scripts/screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/Glint.app screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
